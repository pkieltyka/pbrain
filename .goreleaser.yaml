# GoReleaser configuration for pbrain's release binaries (architecture section 16, decision 10):
# Linux GPU and CPU-only archives, plus untagged macOS, on amd64 and arm64. The Linux amd64 GPU
# archive links CUDA and Vulkan; the Linux arm64 one links CUDA alone, because goinfer's Vulkan
# backend supports Linux amd64 only. All are built with
# CGO_ENABLED=0 and SHA-256 checksums. The macOS binaries are untested and unsupported (architecture
# section 17). .github/workflows/release.yml runs it when a v* tag is pushed. Local check:
#   goreleaser check && goreleaser release --snapshot --clean --skip=publish --parallelism 1
version: 2

project_name: pbrain
report_sizes: true

before:
  hooks:
    - go mod verify

builds:
  - id: pbrain-cpu
    main: ./cmd/pbrain
    binary: pbrain
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # --version prints the tag, as go install at that tag would; a snapshot prints its own version.
    ldflags:
      - -s -w -X github.com/pkieltyka/pbrain/internal/cli.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  # Linux amd64 links both GPU backends and the qualified FP16 kernel.
  - id: pbrain-cuda-vulkan
    main: ./cmd/pbrain
    binary: pbrain
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - cuda
      - vulkan
      - eg2_combined
      - eg2_fp16
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/pkieltyka/pbrain/internal/cli.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: bash .github/scripts/smoke-cuda-release.sh "{{ .Path }}" "{{ .Target }}"
          output: true
  # Linux arm64 links the same CUDA kernels. Vulkan supports Linux amd64 only.
  - id: pbrain-cuda
    main: ./cmd/pbrain
    binary: pbrain
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    tags:
      - cuda
      - eg2_combined
      - eg2_fp16
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/pkieltyka/pbrain/internal/cli.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: bash .github/scripts/smoke-cuda-release.sh "{{ .Path }}" "{{ .Target }}"
          output: true

archives:
  - id: pbrain-cpu
    ids:
      - pbrain-cpu
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Os \"linux\" }}_cpu{{ end }}"
    files:
      - LICENSE
      - README.md
      - src: internal/embed/bge/bert/LICENSE
        dst: licenses/aikit
        strip_parent: true
      - src: internal/embed/bge/bert/NOTICE
        dst: licenses/aikit
        strip_parent: true
  - id: pbrain-gpu
    ids:
      - pbrain-cuda-vulkan
      - pbrain-cuda
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: internal/embed/bge/bert/LICENSE
        dst: licenses/aikit
        strip_parent: true
      - src: internal/embed/bge/bert/NOTICE
        dst: licenses/aikit
        strip_parent: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: pkieltyka
    name: pbrain
  # A person publishes the release after reading the draft.
  draft: true
