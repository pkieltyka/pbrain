name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: gofmt, vet and go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go.mod has no replace or exclude directive (architecture 15)
        run: go test ./internal/buildcheck -run 'TestGoModHasNoReplaceOrExclude' -count=1

  test:
    name: test (${{ matrix.os }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        # macOS test jobs are off: the project targets Linux for now. Mac work is on the
        # Backlog (#1, #9). To restore, add macos-latest back to this list.
        os: [ubuntu-latest] # , macos-latest]
        mode: [race, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the suite under the race detector (cgo on)
        if: matrix.mode == 'race'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: the suite in the release configuration
        if: matrix.mode == 'release'
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: CGO_ENABLED=0 go build ./cmd/pbrain
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/pbrain
