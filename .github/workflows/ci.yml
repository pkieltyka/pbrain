name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: the suite in the release configuration (includes the go.mod check, architecture 15)
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: cross-build linux and darwin, amd64 and arm64
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "build $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/pbrain
          done
      - name: build and vet the GPU builds (no GPU needed)
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags cuda -o /dev/null ./cmd/pbrain
          go build -tags 'cuda eg2_combined' -o /dev/null ./cmd/pbrain
          go vet -tags cuda ./...
          go vet -tags 'cuda eg2_combined' ./...
          GOOS=linux GOARCH=arm64 go build -tags 'cuda eg2_combined eg2_fp16' -o /dev/null ./cmd/pbrain
          GOOS=linux GOARCH=arm64 go vet -tags 'cuda eg2_combined eg2_fp16' ./...
          go build -tags vulkan -o /dev/null ./cmd/pbrain
          go build -tags 'cuda vulkan' -o /dev/null ./cmd/pbrain
          go build -tags 'cuda vulkan eg2_combined eg2_fp16' -o /dev/null ./cmd/pbrain
          go vet -tags vulkan ./...
          go vet -tags 'cuda vulkan' ./...
          go vet -tags 'cuda vulkan eg2_combined eg2_fp16' ./...
          # goinfer's Vulkan backend is Linux amd64 only: on arm64 the tag builds and links nothing of it.
          GOOS=linux GOARCH=arm64 go build -tags 'cuda vulkan' -o /dev/null ./cmd/pbrain
          GOOS=linux GOARCH=arm64 go vet -tags 'cuda vulkan' ./...
          GOOS=darwin GOARCH=arm64 go build -tags metal -o /dev/null ./cmd/pbrain
          GOOS=darwin GOARCH=arm64 go vet -tags metal ./...
      - name: verify CUDA fallback without a GPU
        env:
          CGO_ENABLED: "0"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          go test -tags cuda -run '^TestCUDAFallbackWithoutDevice$' ./internal/embed/gemma2
          go test -tags cuda -run '^TestSyncDeviceNotices$' ./internal/cli
      - name: verify the Vulkan and dual-tag builds without a GPU
        env:
          CGO_ENABLED: "0"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          # Fake devices and source checks only; the tests that need a card or the model skip.
          go test -tags vulkan ./internal/embed/... ./internal/cli
          go test -tags 'cuda vulkan' ./internal/embed/... ./internal/cli
          go test -tags 'cuda vulkan eg2_combined eg2_fp16' ./internal/embed/... ./internal/cli
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          # The GPU builds' smoke script: device listing only, with and without a Vulkan loader.
          PBRAIN_VERIFY_RELEASE_CUDA: devices
      - name: verify release archives and checksums
        run: bash .github/scripts/verify-release-archives.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64-archives
          path: |
            dist/pbrain_*_darwin_arm64.tar.gz
            dist/pbrain_*_darwin_arm64_cpu.tar.gz
          if-no-files-found: error
          retention-days: 1

  race:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: the suite under the race detector (cgo on)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  macos:
    name: macOS arm64 (${{ matrix.mode }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [release, race]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: the runner is darwin/arm64
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64
      - name: the suite in the release configuration
        if: matrix.mode == 'release'
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: build, vet and test the Metal build (fake devices; no GPU work)
        if: matrix.mode == 'release'
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags metal -o /dev/null ./cmd/pbrain
          go vet -tags metal ./...
          go test -tags metal ./internal/embed/... ./internal/cli
      - name: the suite under the race detector
        if: matrix.mode == 'race'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: confirm scenario 41 exercised the pseudo-terminal
        env:
          CGO_ENABLED: ${{ matrix.mode == 'race' && '1' || '0' }}
          GOFLAGS: ${{ matrix.mode == 'race' && '-race' || '' }}
        run: |
          log="$RUNNER_TEMP/pbrain-pty.log"
          go test -count=1 -v -run '^(TestColourPipeAndTerminal|TestScenarios)$/^41-colour$' ./cmd/pbrain | tee "$log"
          grep -F -- '--- PASS: TestColourPipeAndTerminal' "$log"
          grep -F -- '--- PASS: TestScenarios/41-colour' "$log"
          if grep -F 'skipped:' "$log"; then exit 1; fi

  macos-archives:
    name: macOS arm64 release archives
    needs: check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: the runner is darwin/arm64
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64
      - uses: actions/download-artifact@v8
        with:
          name: darwin-arm64-archives
          path: dist
      - name: run each archive's binary
        run: |
          for suffix in "" _cpu; do
            dir="$RUNNER_TEMP/pbrain$suffix"
            mkdir "$dir"
            tar -xzf dist/pbrain_*_darwin_arm64$suffix.tar.gz -C "$dir"
            PBRAIN_SCENARIO_BINARY="$dir/pbrain" go test -count=1 -run '^TestReleaseBinaryOutput$' ./cmd/pbrain
          done
          # Listing only: exit 0 and some output. Which rows a hosted VM lists is not checked.
          out=$("$RUNNER_TEMP/pbrain/pbrain" devices --json)
          test -n "$out"
          echo "$out"
