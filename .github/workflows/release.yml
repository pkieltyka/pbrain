name: release

# Release binaries (architecture section 16, decision 10): on a pushed v* tag, the suite runs in the
# release configuration, then GoReleaser builds Linux GPU and CPU-only binaries, Darwin arm64
# Metal and CPU-only binaries, and an untagged Darwin amd64 binary. The Linux amd64 GPU binary
# links CUDA and Vulkan, the arm64 one CUDA alone. The workflow checks device listing and Gemma CPU
# fallback with the native Linux GPU binary, with and without a Vulkan loader, before uploading archives and SHA-256 checksums
# to a draft release. The suite runs on Linux and cross-builds the Darwin targets.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the suite in the release configuration
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes docs/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PBRAIN_VERIFY_RELEASE_CUDA: "1"
