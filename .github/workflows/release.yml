name: release

# Release binaries (architecture section 16, decision 10): on a pushed v* tag, the suite runs in the
# release configuration, then GoReleaser builds Linux CUDA and CPU-only binaries and untagged
# macOS binaries on amd64 and arm64. It checks Gemma CPU fallback with the native Linux CUDA
# binary before uploading the archives and SHA-256 checksums to a draft release. The suite
# runs on Linux only, and the macOS binaries are untested and unsupported for now
# (architecture section 17).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the suite in the release configuration
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes docs/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PBRAIN_VERIFY_RELEASE_CUDA: "1"
